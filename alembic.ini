# ---------------------------------------------------------------------------
# Alembic configuration for the RAG engine.
# The DSN is NOT stored here: alembic/env.py reads it from config.py so a
# single source of truth (environment) is used by the app and migrations.
# ---------------------------------------------------------------------------

[alembic]
script_location = alembic
prepend_sys_path = .

# Set to 'true' to run the environment during the 'history' command
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
